<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 潛意識電影院 PoC</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; \
            padding: 40px 20px; 
            background: #111111; 
            color: #ffffff; 
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 { color: #ff4757; font-size: 28px; margin-bottom: 10px; }
        p.subtitle { color: #aaa; margin-bottom: 30px; }
        
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #ff6b81; }
        textarea {
            width: 100%; height: 100px; background: #2d2d2d; border: 1px solid #444;
            border-radius: 8px; color: white; padding: 12px; box-sizing: border-box; resize: none;
        }
        
        .btn-submit {
            background: #ff4757; color: white; border: none; padding: 14px 28px;
            font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer;
            width: 100%; transition: 0.2s;
        }
        .btn-submit:hover { background: #ff6b81; }
        
        /* 狀態與結果顯示區 */
        #statusSection {
            margin-top: 30px; background: #2d2d2d; padding: 20px; border-radius: 12px; display: none;
        }
        .loader {
            border: 4px solid #444; border-top: 4px solid #ff4757; border-radius: 50%;
            width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 影片播放器容器 */
        .video-container {
            margin-top: 20px; display: none; background: #000; border-radius: 8px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(255, 71, 87, 0.3);
        }
        video { width: 100%; display: block; max-height: 600px; object-fit: contain; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 潛意識電影院</h1>
        <p class="subtitle">輸入你的夢境，讓 Kling AI 為你放映潛意識電影</p>
        
        <div class="input-group">
            <label for="dreamText">描述你的夢境：</label>
            <textarea id="dreamText" placeholder="例如：我夢見自己走在一座會融化的暗黑森林裡，地上的枯葉泛著霓虹紫光..."></textarea>
        </div>
        
        <button class="btn-submit" id="submitBtn" onclick="startDreamTheater()">開始放映夢境</button>
        
        <div id="statusSection">
            <div id="statusText">正在把夢境交給視覺導演優化...</div>
            <div class="loader" id="statusLoader"></div>
            
            <div class="video-container" id="videoWrapper">
                <video id="dreamVideoPlayer" controls playsinline>
                    您的瀏覽器不支援影片播放。
                </video>
            </div>
        </div>
    </div>

    <script>
        async function startDreamTheater() {
            const text = document.getElementById('dreamText').value;
            const submitBtn = document.getElementById('submitBtn');
            const statusSection = document.getElementById('statusSection');
            const statusText = document.getElementById('statusText');
            const statusLoader = document.getElementById('statusLoader');
            const videoWrapper = document.getElementById('videoWrapper');
            const videoPlayer = document.getElementById('dreamVideoPlayer');

            if (!text.trim()) {
                alert('請先寫下一些夢境細節喔！');
                return;
            }

            // 按鈕防連點、開啟狀態欄、隱藏前一次的影片
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.5";
            statusSection.style.display = 'block';
            videoWrapper.style.display = 'none';
            statusLoader.style.display = 'block';
            statusText.innerText = "✨ 導演正在拆解夢境並生成提示詞...";

            try {
                // 1. 送出請求給後端建立 Kling 任務
                const formData = new FormData();
                formData.append('mode', 'submit');
                formData.append('text', text);

                const response = await fetch('/api/dream-process', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || '啟動夢境失敗');
                }

                const taskId = result.taskId;
                statusText.innerText = "⏳ 夢境已送達快手(Kling)底層！開始排隊渲染影片...";

                // 2. 開啟定時器（每 5 秒詢問一次進度）
                const checkInterval = setInterval(async () => {
                    try {
                        const checkForm = new FormData();
                        checkForm.append('mode', 'check_status');
                        checkForm.append('taskId', taskId);

                        const checkResponse = await fetch('/api/dream-process', {
                            method: 'POST',
                            body: checkForm
                        });
                        const checkResult = await checkResponse.json();

                        if (checkResult.success) {
                            const currentStatus = checkResult.status;
                            
                            if (currentStatus === 'SUCCEED' || currentStatus === 'succeed') {
                                // 影片大功告成！
                                clearInterval(checkInterval);
                                statusText.innerText = "🎉 你的夢境電影已經放映成功！請看下方：";
                                statusLoader.style.display = 'none';
                                
                                // 把快手做好的影片網址塞進播放器，並大方秀出來
                                videoPlayer.src = checkResult.videoUrl;
                                videoWrapper.style.display = 'block';
                                videoPlayer.load();
                                videoPlayer.play();
                                
                                submitBtn.disabled = false;
                                submitBtn.style.opacity = "1";
                            } 
                            else if (currentStatus === 'FAILED' || currentStatus === 'failed') {
                                clearInterval(checkInterval);
                                statusText.innerText = "❌ Kling 影像生成失敗，可能內容過於抽象，請換個描述再試一次。";
                                statusLoader.style.display = 'none';
                                submitBtn.disabled = false;
                                submitBtn.style.opacity = "1";
                            } 
                            else {
                                // 還在處理中（QUEUED 或 PROCESSING）
                                statusText.innerText = `⏳ 影片製作中... 目前 Kling 狀態：${currentStatus === 'PROCESSING' ? '🎥 正在渲染畫面' : '💤 排隊等待中'}`;
                            }
                        }
                    } catch (err) {
                        console.log("檢查進度時發生微小震盪，持續嘗試中...", err);
                    }
                }, 5000);

            } catch (error) {
                alert('發生錯誤：' + error.message);
                statusSection.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
