<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 潛意識電影院 PoC</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center; \
            padding: 40px 20px; 
            background: #111111; 
            color: #ffffff; 
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 { color: #ff4757; font-size: 28px; margin-bottom: 10px; }
        p.subtitle { color: #aaa; margin-bottom: 30px; }
        
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #ff6b81; }
        textarea {
            width: 100%;
            height: 120px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            border-color: #ff4757;
            outline: none;
        }
        
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #ff6b81; }
        button:disabled { background: #555; cursor: not-allowed; }

        .status-section {
            margin-top: 30px;
            padding: 20px;
            background: #2d2d2d;
            border-radius: 8px;
            display: none;
        }
        .loader {
            border: 4px solid #444;
            border-top: 4px solid #ff4757;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 影片展示區塊優化 */
        .video-container {
            margin-top: 30px;
            display: none;
            background: #000;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        video {
            width: 100%;
            max-width: 360px; /* 直式 9:16 最適合的手機寬度 */
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 潛意識電影院 PoC</h1>
        <p class="subtitle">輸入你的夢境描述，讓 Kling AI 幫你實體化</p>

        <div class="input-group">
            <label for="dreamPrompt">🌌 描繪你的夢境世界：</label>
            <textarea id="dreamPrompt" placeholder="例如：一隻穿著西裝的貓在霓虹閃爍的爵士酒吧裡彈鋼琴，超現實主義，光影迷幻..."></textarea>
        </div>

        <button id="submitBtn" onclick="startDreamProcess()">開始做夢 🎥</button>

        <div id="statusSection" class="status-section">
            <div class="loader"></div>
            <p id="statusText">正在把夢境傳送給 Kling 電影院...</p>
        </div>

        <div id="videoContainer" class="video-container">
            <h3 style="color: #ff6b81; margin-bottom: 15px;">🍿 你的夢境電影上映了！</h3>
            <video id="dreamVideo" controls playsinline>
                <source id="videoSource" src="" type="video/mp4">
                你的瀏覽器不支援播放此影片。
            </video>
        </div>
    </div>

    <script>
        async function startDreamProcess() {
            const promptInput = document.getElementById('dreamPrompt');
            const submitBtn = document.getElementById('submitBtn');
            const statusSection = document.getElementById('statusSection');
            const statusText = document.getElementById('statusText');
            const videoContainer = document.getElementById('videoContainer');
            const dreamVideo = document.getElementById('dreamVideo');
            const videoSource = document.getElementById('videoSource');

            if (!promptInput.value.trim()) {
                alert('請先輸入一些夢境描述喔！');
                return;
            }

            // 1. 初始化介面狀態
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.5";
            statusSection.style.display = "block";
            videoContainer.style.display = "none"; // 先把上一次的影片藏起來
            statusText.innerText = "🚀 正在與 Kling AI 伺服器連線中...";

            try {
                // 2. 階段一：建立任務
                const formData = new FormData();
                formData.append('mode', 'create_task');
                formData.append('prompt', promptInput.value);

                const response = await fetch('/api/dream-process', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || '生成任務失敗');
                }

                const taskId = result.taskId;
                statusText.innerText = "⏳ 已經排上隊了！正在為您繪製夢境... (每 5 秒更新一次)";

                // 3. 階段二：每 5 秒自動去問好沒了沒 (輪詢 Polling)
                const checkInterval = setInterval(async () => {
                    try {
                        const checkForm = new FormData();
                        checkForm.append('mode', 'check_status');
                        checkForm.append('taskId', taskId);

                        const checkRes = await fetch('/api/dream-process', {
                            method: 'POST',
                            body: checkForm
                        });

                        const checkResult = await checkRes.json();

                        if (checkResult.success) {
                            const currentStatus = checkResult.status;

                            // 如果成功好了！
                            if (currentStatus === 'SUCCESS' && checkResult.videoUrl) {
                                clearInterval(checkInterval); // 停止繼續問
                                statusSection.style.display = 'none'; // 藏起載入圈圈
                                
                                // 【核心功能】直接把網址填入 video 標籤，秀出影片
                                videoSource.src = checkResult.videoUrl;
                                videoContainer.style.display = "block";
                                dreamVideo.load();
                                dreamVideo.play(); // 自動試著撥放
                                
                                // 恢復按鈕功能
                                submitBtn.disabled = false;
                                submitBtn.style.opacity = "1";
                            } 
                            // 如果不幸失敗了
                            else if (currentStatus === 'FAILED') {
                                clearInterval(checkInterval);
                                statusText.innerText = "❌ Kling 影像生成失敗，可能內容觸發安全審查，請換個描述試試。";
                                submitBtn.disabled = false;
                                submitBtn.style.opacity = "1";
                            } 
                            // 還在處理中
                            else {
                                statusText.innerText = `⏳ 影片製作中... 目前 Kling 狀態：正在努力渲染中，請堅持一下下！`;
                            }
                        }
                    } catch (err) {
                        console.log("正在努力重新連線查詢中...", err);
                    }
                }, 5000); // 5 秒問一次

            } catch (error) {
                alert('發生錯誤：' + error.message);
                statusSection.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
