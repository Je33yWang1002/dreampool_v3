<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 潛意識電影院 PoC</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center; 
            padding: 40px 20px; 
            background: #111111; 
            color: #ffffff; 
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 { color: #ff4757; font-size: 28px; margin-bottom: 10px; }
        p.subtitle { color: #aaa; margin-bottom: 30px; }
        
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #ff6b81; }
        textarea {
            width: 100%;
            height: 120px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            resize: vertical;
        }
        
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #ff6b81; }
        button:disabled { background: #555; cursor: not-allowed; }

        .status-section {
            margin-top: 30px;
            padding: 20px;
            background: #252525;
            border-radius: 8px;
            border-left: 4px solid #ff4757;
            display: none;
        }

        /* 影片展示框架優化 */
        .video-container {
            margin-top: 25px;
            display: none;
            background: #000;
            padding: 10px;
            border-radius: 12px;
        }
        video {
            width: 100%;
            max-height: 500px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 潛意識電影院</h1>
        <p class="subtitle">輸入你的夢境描述，讓 Kling AI 幫你具現化</p>

        <div class="input-group">
            <label for="promptInput">🌙 夢境場景描述 (建議用英文效果最好)：</label>
            <textarea id="promptInput" placeholder="例如：A surreal dream of a glowing whale floating through a neon-lit cyberpunk city sky, cinematic lighting, 8k resolution..."></textarea>
        </div>

        <button id="submitBtn" onclick="startDreamGeneration()">開始具現化夢境影片</button>

        <div id="statusSection" class="status-section">
            <p id="statusText">🚀 正在向 Kling AI 送出請求...</p>
        </div>

        <div id="videoContainer" class="video-container">
            <h3 style="color: #2ed573; margin-top: 0;">✨ 夢境影片生成成功！</h3>
            <video id="dreamVideo" controls playsinline></video>
        </div>
    </div>

    <script>
        async function startDreamGeneration() {
            const promptInput = document.getElementById('promptInput').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const statusSection = document.getElementById('statusSection');
            const statusText = document.getElementById('statusText');
            const videoContainer = document.getElementById('videoContainer');
            const dreamVideo = document.getElementById('dreamVideo');

            if (!promptInput) {
                alert('請先輸入一些夢境描述喔！');
                return;
            }

            // 1. 初始化介面狀態
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.6";
            statusSection.style.display = 'block';
            videoContainer.style.display = 'none';
            statusText.innerText = "🚀 正在與 Kling AI 通訊，請稍候...";

            try {
                // 2. 第一階段：呼叫後端建立生成任務
                const formData = new FormData();
                formData.append('mode', 'create_task');
                formData.append('prompt', promptInput);

                const response = await fetch('/api/dream-process', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || '建立任務失敗');
                }

                const taskId = result.taskId;
                statusText.innerText = `⏳ 任務建立成功！正在排隊中... (任務 ID: ${taskId})`;

                // 3. 第二階段：每隔 5 秒鐘自動去問後端「影片好了沒？」
                const checkInterval = setInterval(async () => {
                    try {
                        const checkForm = new FormData();
                        checkForm.append('mode', 'check_status');
                        checkForm.append('taskId', taskId);

                        const checkRes = await fetch('/api/dream-process', {
                            method: 'POST',
                            body: checkForm
                        });

                        const checkData = await checkRes.json();

                        if (checkData.success) {
                            const currentStatus = checkData.status;

                            // 如果狀態是 SUCCESS 或是 SUCCEED，代表做好了
                            if (currentStatus === 'SUCCESS' || currentStatus === 'SUCCEED') {
                                clearInterval(checkInterval);
                                statusText.innerText = "🎉 影片生成完成！";
                                
                                // 把影片網址塞進播放器，並秀出畫面
                                dreamVideo.src = checkData.videoUrl;
                                videoContainer.style.display = "block";
                                dreamVideo.load();
                                
                                // 恢復按鈕點擊功能
                                submitBtn.disabled = false;
                                submitBtn.style.opacity = "1";
                            } 
                            // 如果不幸失敗了（通常是字詞敏感被擋）
                            else if (currentStatus === 'FAILED') {
                                clearInterval(checkInterval);
                                statusText.innerText = "❌ Kling 影像生成失敗，可能內容觸發安全審查，請換個描述試試。";
                                submitBtn.disabled = false;
                                submitBtn.style.opacity = "1";
                            } 
                            // 仍在處理中
                            else {
                                statusText.innerText = `⏳ 影片製作中... 目前 Kling 狀態：${currentStatus === 'PROCESSING' ? '🎥 正在努力渲染影片' : '💤 排隊等待中'}`;
                            }
                        }
                    } catch (err) {
                        console.log("正在努力重新連線查詢中...", err);
                    }
                }, 5000); // 5000 毫秒 = 5 秒

            } catch (error) {
                alert('發生錯誤：' + error.message);
                statusSection.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
