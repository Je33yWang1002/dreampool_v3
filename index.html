<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 潛意識電影院 PoC</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 50px 20px; background: #1a1a1a; color: white; }
        .controls { margin-bottom: 40px; }
        button { padding: 15px 40px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 50px; border: none; margin: 10px; }
        #start { background: #ff4757; color: white; }
        #stop { background: #2f3542; color: white; }
        #status { margin: 20px 0; color: #ffd32a; min-height: 1.5em; }
        #result { max-width: 600px; margin: 0 auto; text-align: left; background: #2f3542; padding: 30px; border-radius: 15px; display: none; }
        .tag { display: inline-block; background: #57606f; padding: 4px 12px; border-radius: 5px; margin-right: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🎬 潛意識電影院</h1>
    <p>說出你的夢境，AI 將為你編導影片...</p>
    
    <div class="controls">
        <button id="start">按一下開始說話</button>
        <button id="stop" style="display:none;">說完了，開始解夢</button>
    </div>

    <div id="status">準備就緒</div>

    <div id="result">
        <h2 style="color:#ff4757;">解夢分析完成</h2>
        <p><strong>原始夢境：</strong> <span id="rawText"></span></p>
        <p><strong>影片指令 (Prompt)：</strong> <span id="videoPrompt" style="color: #70a1ff;"></span></p>
        <div id="tagContainer"></div>
    </div>

    <script>
        let chunks = [];
        let mediaRecorder;

        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        startBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // 強制指定格式以提高 Whisper 相容性
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                
                mediaRecorder.onstop = async () => {
                    statusDiv.innerHTML = "⌛ 正在解析語音中，請稍候...";
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('file', blob, 'dream.webm');

                    try {
                        const response = await fetch('/api/dream-process', { method: 'POST', body: formData });
                        const result = await response.json();

                        if (result.success) {
                            resultDiv.style.display = 'block';
                            document.getElementById('rawText').innerText = result.rawTranscript;
                            document.getElementById('videoPrompt').innerText = result.videoPrompt;
                            const tagContainer = document.getElementById('tagContainer');
                            tagContainer.innerHTML = result.tags.map(t => `<span class="tag">#${t}</span>`).join('');
                            statusDiv.innerText = "✨ 分析成功！";
                        } else {
                            statusDiv.innerText = "❌ 錯誤：" + result.error;
                        }
                    } catch (err) {
                        statusDiv.innerText = "❌ 連線失敗，請檢查 Vercel 設定";
                    }
                };

                mediaRecorder.start();
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                statusDiv.innerText = "🔴 正在錄音... 請描述你的夢境內容";
                chunks = [];
            } catch (err) {
                statusDiv.innerText = "❌ 無法使用麥克風，請確認瀏覽器權限";
            }
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            stopBtn.style.display = 'none';
            startBtn.style.display = 'inline-block';
            startBtn.innerText = "再錄一次";
        };
    </script>
</body>
</html>
