<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 潛意識電影院 PoC</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 50px 20px; background: #1a1a1a; color: white; }
        #result { max-width: 600px; margin: 20px auto; text-align: left; background: #2f3542; padding: 30px; border-radius: 15px; display: none; }
        .seed-row { display: flex; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .seed-label { width: 85px; color: #ff4757; font-weight: bold; font-size: 14px; }
        .seed-input { background: transparent; border: none; color: #fff; width: 100%; font-size: 16px; outline: none; }
        .prompt-box { background: #1e272e; padding: 15px; border-radius: 8px; color: #70a1ff; font-family: monospace; margin-top: 10px; min-height: 50px; }
        .tag { display: inline-block; background: #70a1ff; color: white; padding: 4px 12px; border-radius: 5px; margin: 5px 8px 5px 0; }
        button { padding: 15px 40px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; margin: 10px; font-size: 16px; transition: all 0.3s; }
        #start { background: #ff4757; color: white; }
        #stop { background: #57606f; color: white; }
        #developBtn { background: #ffd32a; color: #1a1a1a; width: 100%; margin-top: 20px; font-size: 18px; }
        
        /* 影片播放器樣式：標準 9:16 直式大螢幕 */
        .video-container { margin-top: 25px; text-align: center; display: none; background: #1e272e; padding: 20px; border-radius: 12px; border: 1px solid #ffd32a; }
        video { width: 100%; max-width: 320px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .loading-movie { color: #ffd32a; font-style: italic; margin-top: 15px; text-align: center; display: none; padding: 10px; background: rgba(255,211,42,0.1); border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🎬 潛意識電影院</h1>
    <button id="start">按一下開始說話</button>
    <button id="stop" style="display:none;">說完了，解析夢境</button>
    <div id="status" style="margin:20px; color:#ffd32a;">準備就緒</div>

    <div id="result">
        <h2 style="color:#ff4757; margin:0 0 20px 0;">✨ 解夢分析完成</h2>
        <div id="rawText" style="color:#aaa; margin-bottom:20px; font-style: italic;"></div>

        <p><strong>【夢境種子】(可手動點擊修改)</strong></p>
        <div class="seed-row"><span class="seed-label">• 場景：</span><input id="s-scene" class="seed-input" placeholder="點擊填寫..."></div>
        <div class="seed-row"><span class="seed-label">• 情緒：</span><input id="s-mood" class="seed-input" placeholder="點擊填寫..."></div>
        <div class="seed-row"><span class="seed-label">• 人物：</span><input id="s-character" class="seed-input" placeholder="點擊填寫..."></div>
        <div class="seed-row"><span class="seed-label">• 顏色：</span><input id="s-color" class="seed-input" placeholder="點擊填寫..."></div>
        <div class="seed-row"><span class="seed-label">• 感受：</span><input id="s-feeling" class="seed-input" placeholder="點擊填寫..."></div>
        
        <button id="developBtn">🎞️ 夢境沖洗 (Kling AI 生成影片)</button>

        <div id="movieLoadingStatus" class="loading-movie">⌛ 正在膠捲顯影中，Kling AI 正在生成超現實夢境... (每 8 秒自動刷新進度)</div>

        <div id="videoDisplaySection" class="video-container">
            <p style="text-align:left; color:#ffd32a; margin-top:0;"><strong>🔮 您的潛意識電影上映了：</strong></p>
            <video id="dreamVideoPlayer" controls autoplay loop playsinline></video>
        </div>

        <div id="finalOutput" style="margin-top:30px; display:none;">
            <p><strong>AI 影片指令 (Video Prompt)：</strong></p>
            <div id="videoPrompt" class="prompt-box"></div>
            <p style="margin-top:20px;"><strong>情緒標籤：</strong></p>
            <div id="tagContainer"></div>
        </div>
    </div>

    <script>
        let chunks = []; let mediaRecorder;
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        const developBtn = document.getElementById('developBtn');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        startBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    statusDiv.innerText = "⌛ 正在掃描夢境種子...";
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('file', blob, 'dream.webm');
                    
                    const res = await fetch('/api/dream-process', { method: 'POST', body: formData });
                    const data = await res.json();
                    
                    if (data.success) {
                        statusDiv.innerText = "✅ 已提取種子，請確認或修改後點擊「夢境沖洗」";
                        resultDiv.style.display = 'block';
                        document.getElementById('rawText').innerText = "「 " + data.rawTranscript + " 」";
                        document.getElementById('s-scene').value = data.seeds.scene || "";
                        document.getElementById('s-mood').value = data.seeds.mood || "";
                        document.getElementById('s-character').value = data.seeds.character || "";
                        document.getElementById('s-color').value = data.seeds.color || "";
                        document.getElementById('s-feeling').value = data.seeds.feeling || "";
                        
                        document.getElementById('videoDisplaySection').style.display = 'none';
                        document.getElementById('movieLoadingStatus').style.display = 'none';
                    } else {
                        statusDiv.innerText = "❌ 失敗：" + (data.error || "無法解析語音");
                    }
                };
                mediaRecorder.start();
                startBtn.style.display='none'; stopBtn.style.display='inline-block';
                statusDiv.innerText = "🎙️ 正在傾聽您的夢境，請說話...";
            } catch(e) {
                statusDiv.innerText = "❌ 無法啟動麥克風，請檢查瀏覽器權限設定";
            }
        };

        stopBtn.onclick = () => { mediaRecorder.stop(); startBtn.style.display='inline-block'; stopBtn.style.display='none'; };

        developBtn.onclick = async () => {
            statusDiv.innerText = "🎬 正在啟動 Kling AI 生成夢境影像...";
            developBtn.disabled = true;
            developBtn.style.opacity = "0.5";
            
            const seeds = {
                scene: document.getElementById('s-scene').value,
                mood: document.getElementById('s-mood').value,
                character: document.getElementById('s-character').value,
                color: document.getElementById('s-color').value,
                feeling: document.getElementById('s-feeling').value
            };

            const formData = new FormData();
            formData.append('mode', 'develop');
            formData.append('seeds', JSON.stringify(seeds));

            try {
                const res = await fetch('/api/dream-process', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    statusDiv.innerText = "🚀 任務已送達 Kling！開始排隊沖洗影片...";
                    document.getElementById('finalOutput').style.display = 'block';
                    document.getElementById('videoPrompt').innerText = data.videoPrompt;
                    document.getElementById('tagContainer').innerHTML = data.tags.map(t => `<span class="tag">#${t}</span>`).join('');
                    
                    document.getElementById('movieLoadingStatus').style.display = 'block';
                    pollVideoStatus(data.taskId);
                } else {
                    statusDiv.innerText = "❌ 失敗：" + data.error;
                    developBtn.disabled = false;
                    developBtn.style.opacity = "1";
                }
            } catch (e) {
                statusDiv.innerText = "❌ 網路連線錯誤";
                developBtn.disabled = false;
                developBtn.style.opacity = "1";
            }
        };

        function pollVideoStatus(taskId) {
            const interval = setInterval(async () => {
                const checkData = new FormData();
                checkData.append('mode', 'check_status');
                checkData.append('taskId', taskId);

                try {
                    const res = await fetch('/api/dream-process', { method: 'POST', body: checkData });
                    const statusResult = await res.json();

                    if (statusResult.success) {
                        const currentStatus = statusResult.status;
                        
                        if (currentStatus === 'SUCCESS' && statusResult.videoUrl) {
                            clearInterval(interval);
                            document.getElementById('movieLoadingStatus').style.display = 'none';
                            statusDiv.innerText = "🎉 夢境影片沖洗成功！";
                            
                            const player = document.getElementById('dreamVideoPlayer');
                            player.src = statusResult.videoUrl;
                            document.getElementById('videoDisplaySection').style.display = 'block';
                            
                            developBtn.disabled = false;
                            developBtn.style.opacity = "1";
                        } else if (currentStatus === 'FAILED') {
                            clearInterval(interval);
                            document.getElementById('movieLoadingStatus').style.display = 'none';
                            statusDiv.innerText = "❌ Kling 影像生成失敗，請再試一次";
                            developBtn.disabled = false;
                            developBtn.style.opacity = "1";
                        } else {
                            statusDiv.innerText = "⏳ 影片製作中... 目前狀態：" + (currentStatus === 'PROCESSING' ? "正在渲染影片" : "排隊中");
                        }
                    }
                } catch (e) {
                    console.log("檢查進度中：", e);
                }
            }, 8000);
        }
    </script>
</body>
</html>
