<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 潛意識電影院 PoC</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; \
            text-align: center; 
            padding: 40px 20px; 
            background: #111111; 
            color: #ffffff; 
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 { color: #ff4757; font-size: 28px; margin-bottom: 10px; }
        p.subtitle { color: #aaa; margin-bottom: 30px; }
        
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #ff6b81; }
        textarea {
            width: 100%;
            height: 120px;
            background: #2d2d2d;
            border: 2px solid #3f3f3f;
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus { border-color: #ff4757; outline: none; }
        
        button {
            width: 100%;
            background: #ff4757;
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #ff2a3b; }
        button:disabled { background: #555; cursor: not-allowed; }

        /* 狀態與結果顯示區 */
        .status-section {
            margin-top: 30px;
            padding: 20px;
            background: #252525;
            border-radius: 8px;
            display: none;
        }
        .status-text { font-size: 16px; color: #ff6b81; font-weight: bold; margin-bottom: 15px; }
        
        .result-video {
            width: 100%;
            max-width: 360px;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 潛意識電影院</h1>
        <p class="subtitle">輸入你的夢境，讓 Kling AI 幫你具現化成電影短片</p>
        
        <div class="input-group">
            <label for="dreamInput">請輸入夢境場景描述（中英文皆可）：</label>
            <textarea id="dreamInput" placeholder="例如：一個穿著黑色連帽衫的人，在霓虹閃爍的賽博朋克下雨街道上獨自走著，背影帶著孤獨感，慢動作..."></textarea>
        </div>
        
        <button id="submitBtn" onclick="generateDreamMovie()">開始具現化夢境電影</button>
        
        <div id="statusSection" class="status-section">
            <div id="statusText" class="status-text">⏳ 正在與夢境伺服器連線...</div>
            <video id="videoPlayer" class="result-video" controls playsinline></video>
        </div>
    </div>

    <script>
        async function generateDreamMovie() {
            const dreamText = document.getElementById('dreamInput').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const statusSection = document.getElementById('statusSection');
            const statusText = document.getElementById('statusText');
            const videoPlayer = document.getElementById('videoPlayer');

            if (!dreamText) {
                alert('請先輸入一些夢境內容描述喔！');
                return;
            }

            // 1. 初始化介面狀態
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.6";
            statusSection.style.display = 'block';
            videoPlayer.style.display = 'none';
            statusText.innerText = "🚀 正在將夢境轉換為畫面指令，並提交給 Kling AI...";

            try {
                // 2. 呼叫後端建立 Kling 任務
                const formData = new FormData();
                formData.append('mode', 'create_task');
                formData.append('prompt', dreamText);
                formData.append('tags', '夢境,超現實');

                const response = await fetch('/api/dream-process', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || '提交夢境失敗');
                }

                const taskId = result.taskId;
                statusText.innerText = `⏳ 任務建立成功！Kling 正在排隊渲染中... (任務ID: ${taskId})`;

                // 3. 開始定時輪詢 (每 5 秒跟 Kling 詢問一次好了沒)
                const checkInterval = setInterval(async () => {
                    try {
                        const checkForm = new FormData();
                        checkForm.append('mode', 'check_status');
                        checkForm.append('taskId', taskId);

                        const checkResponse = await fetch('/api/dream-process', {
                            method: 'POST',
                            body: checkForm
                        });
                        const checkData = await checkResponse.json();

                        if (checkData.success) {
                            const currentStatus = checkData.status; // SUCCEED, PROCESSING, QUEUED, FAILED

                            if (currentStatus === 'SUCCEED') {
                                // 成功了！停止計時器
                                clearInterval(checkInterval);
                                statusText.innerText = "🎉 你的潛意識夢境電影放映成功！";
                                
                                // 把影片網址塞進播放器，並顯示出來
                                videoPlayer.src = checkData.videoUrl;
                                videoPlayer.style.display = "inline-block";
                                videoPlayer.load();
                                videoPlayer.play();
                                
                                // 恢復按鈕功能
                                submitBtn.disabled = false;
                                submitBtn.style.opacity = "1";
                            } 
                            else if (currentStatus === 'FAILED') {
                                clearInterval(checkInterval);
                                statusText.innerText = "❌ Kling 影像生成失敗，可能內容觸發安全審查，請換個描述試試。";
                                submitBtn.disabled = false;
                                submitBtn.style.opacity = "1";
                            } 
                            else {
                                // 還在處理中
                                statusText.innerText = `⏳ 影片製作中... 目前 Kling 狀態：${currentStatus === 'PROCESSING' ? '🎥 正在渲染影片' : '💤 排隊等待中'}`;
                            }
                        }
                    } catch (err) {
                        console.log("正在努力重新連線查詢中...", err);
                    }
                }, 5000);

            } catch (error) {
                alert('發生錯誤：' + error.message);
                statusSection.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
