<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 潛意識電影院 PoC</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 50px 20px; background: #1a1a1a; color: white; }
        #result { max-width: 600px; margin: 20px auto; text-align: left; background: #2f3542; padding: 30px; border-radius: 15px; display: none; }
        .seed-row { display: flex; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .seed-label { width: 80px; color: #ff4757; font-weight: bold; }
        .seed-input { background: transparent; border: none; color: #ced4da; width: 100%; font-size: 16px; outline: none; }
        .seed-input:focus { color: #fff; }
        .prompt-box { background: #1e272e; padding: 15px; border-radius: 8px; color: #70a1ff; font-family: monospace; margin-top: 10px; }
        .tag { display: inline-block; background: #70a1ff; color: white; padding: 4px 12px; border-radius: 5px; margin: 5px 8px 5px 0; }
        button { padding: 15px 40px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; }
        #start { background: #ff4757; color: white; }
    </style>
</head>
<body>
    <h1>🎬 潛意識電影院</h1>
    <button id="start">按一下開始說話</button>
    <button id="stop" style="display:none; background:#2f3542; color:white;">說完了，開始解夢</button>
    <div id="status" style="margin:20px; color:#ffd32a;">準備就緒</div>

    <div id="result">
        <h2 style="color:#ff4757;">✨ 解夢分析完成</h2>
        <p><strong>【原始夢境】</strong></p>
        <div id="rawText" style="color:#aaa; margin-bottom:20px;"></div>

        <p><strong>【夢境種子】(可手動補寫)</strong></p>
        <div class="seed-row"><span class="seed-label">• 場景：</span><input id="s-scene" class="seed-input" placeholder="點擊填寫..."></div>
        <div class="seed-row"><span class="seed-label">• 情緒：</span><input id="s-mood" class="seed-input" placeholder="點擊填寫..."></div>
        <div class="seed-row"><span class="seed-label">• 人物：</span><input id="s-character" class="seed-input" placeholder="點擊填寫..."></div>
        <div class="seed-row"><span class="seed-label">• 顏色：</span><input id="s-color" class="seed-input" placeholder="點擊填寫..."></div>
        <div class="seed-row"><span class="seed-label">• 感受：</span><input id="s-feeling" class="seed-input" placeholder="點擊填寫..."></div>
        
        <p style="margin-top:20px;"><strong>AI 影片指令 (Video Prompt)：</strong></p>
        <div id="videoPrompt" class="prompt-box"></div>
        <div id="tagContainer" style="margin-top:20px;"></div>
    </div>

    <script>
        let chunks = []; let mediaRecorder;
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        startBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = async () => {
                statusDiv.innerText = "⌛ 解析中...";
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('file', blob, 'dream.webm');
                const res = await fetch('/api/dream-process', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    statusDiv.innerText = "✅ 完成";
                    resultDiv.style.display = 'block';
                    document.getElementById('rawText').innerText = data.rawTranscript;
                    document.getElementById('s-scene').value = data.seeds.scene;
                    document.getElementById('s-mood').value = data.seeds.mood;
                    document.getElementById('s-character').value = data.seeds.character;
                    document.getElementById('s-color').value = data.seeds.color;
                    document.getElementById('s-feeling').value = data.seeds.feeling;
                    document.getElementById('videoPrompt').innerText = data.videoPrompt;
                    document.getElementById('tagContainer').innerHTML = data.tags.map(t => `<span class="tag">#${t}</span>`).join('');
                }
            };
            mediaRecorder.start();
            startBtn.style.display='none'; stopBtn.style.display='inline-block';
        };
        stopBtn.onclick = () => { mediaRecorder.stop(); startBtn.style.display='inline-block'; stopBtn.style.display='none'; };
    </script>
</body>
</html>
