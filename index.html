<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 潛意識電影院 PoC</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 50px 20px; background: #1a1a1a; color: white; }
        #result { max-width: 600px; margin: 20px auto; text-align: left; background: #2f3542; padding: 30px; border-radius: 15px; display: none; }
        .seed-row { display: flex; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .seed-label { width: 85px; color: #ff4757; font-weight: bold; font-size: 14px; }
        .seed-input { background: transparent; border: none; color: #fff; width: 100%; font-size: 16px; outline: none; }
        .prompt-box { background: #1e272e; padding: 15px; border-radius: 8px; color: #70a1ff; font-family: monospace; margin-top: 10px; min-height: 50px; white-space: pre-wrap; word-break: break-all; }
        .tag { display: inline-block; background: #70a1ff; color: white; padding: 4px 12px; border-radius: 5px; margin: 5px 8px 5px 0; }
        button { padding: 15px 40px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; margin: 10px; }
        #start { background: #ff4757; color: white; }
        #developBtn { background: #ffd32a; color: #1a1a1a; width: 100%; margin-top: 20px; font-size: 18px; }
        video { width: 100%; border-radius: 10px; margin-top: 20px; border: 2px solid #ffd32a; display: block; }
    </style>
</head>
<body>
    <h1>🎬 潛意識電影院</h1>
    <button id="start">按一下開始說話</button>
    <button id="stop" style="display:none; background:#2f3542; color:white;">說完了，解析夢境</button>
    <div id="status" style="margin:20px; color:#ffd32a;">準備就緒</div>

    <div id="result">
        <h2 style="color:#ff4757; margin:0 0 20px 0;">✨ 解夢分析完成</h2>
        <div id="rawText" style="color:#aaa; margin-bottom:20px; font-style: italic;"></div>

        <p><strong>【夢境種子】(可手動補強)</strong></p>
        <div class="seed-row"><span class="seed-label">• 場景：</span><input id="s-scene" class="seed-input" placeholder="等待分析..."></div>
        <div class="seed-row"><span class="seed-label">• 情緒：</span><input id="s-mood" class="seed-input" placeholder="等待分析..."></div>
        <div class="seed-row"><span class="seed-label">• 人物：</span><input id="s-character" class="seed-input" placeholder="等待分析..."></div>
        <div class="seed-row"><span class="seed-label">• 顏色：</span><input id="s-color" class="seed-input" placeholder="等待分析..."></div>
        <div class="seed-row"><span class="seed-label">• 感受：</span><input id="s-feeling" class="seed-input" placeholder="等待分析..."></div>
        
        <button id="developBtn">🎞️ 夢境沖洗 (等待約 2 分鐘)</button>

        <div id="finalOutput" style="margin-top:30px; display:none;">
            <p><strong>🎞️ 夢境影像：</strong></p>
            <video id="dreamVideo" controls autoplay loop></video>
            <p style="margin-top:20px;"><strong>AI 影片指令 (Video Prompt)：</strong></p>
            <div id="videoPrompt" class="prompt-box"></div>
            <div id="tagContainer" style="margin-top:10px;"></div>
        </div>
    </div>

    <script>
        let chunks = []; let mediaRecorder;
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        const developBtn = document.getElementById('developBtn');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        startBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = async () => {
                statusDiv.innerText = "⌛ 正在掃描夢境種子...";
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('file', blob, 'dream.webm');

                try {
                    const res = await fetch('/api/dream-process', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.success) {
                        statusDiv.innerText = "✅ 已提取種子，請修正後點擊「夢境沖洗」";
                        resultDiv.style.display = 'block';
                        document.getElementById('rawText').innerText = data.rawTranscript;
                        
                        // 修復：將 AI 回傳的英文 key 對應到前端輸入框
                        document.getElementById('s-scene').value = data.seeds.scene || "";
                        document.getElementById('s-mood').value = data.seeds.mood || "";
                        document.getElementById('s-character').value = data.seeds.character || "";
                        document.getElementById('s-color').value = data.seeds.color || "";
                        document.getElementById('s-feeling').value = data.seeds.feeling || "";
                    }
                } catch (e) {
                    statusDiv.innerText = "❌ 解析失敗";
                }
            };
            mediaRecorder.start();
            startBtn.style.display='none'; stopBtn.style.display='inline-block';
        };

        stopBtn.onclick = () => { mediaRecorder.stop(); startBtn.style.display='inline-block'; stopBtn.style.display='none'; };
