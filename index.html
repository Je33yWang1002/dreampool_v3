<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 潛意識電影院 PoC</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 50px 20px; background: #1a1a1a; color: white; }
        #result { max-width: 600px; margin: 20px auto; text-align: left; background: #2f3542; padding: 30px; border-radius: 15px; display: none; }
        .seed-row { display: flex; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .seed-label { width: 85px; color: #ff4757; font-weight: bold; font-size: 14px; }
        .seed-input { background: transparent; border: none; color: #fff; width: 100%; font-size: 16px; outline: none; }
        .prompt-box { background: #1e272e; padding: 15px; border-radius: 8px; color: #70a1ff; font-family: monospace; margin-top: 10px; min-height: 50px; }
        .tag { display: inline-block; background: #ff4757; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; margin-right: 8px; margin-top: 5px; font-weight: bold; }
        .btn { background: #ff4757; color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; width: 100%; max-width: 300px; margin-top: 20px; }
        .btn:disabled { background: #747d8c; cursor: not-allowed; }
        #movieLoadingStatus { color: #ffa502; font-weight: bold; margin-top: 15px; font-size: 16px; }
        video { width: 100%; border-radius: 10px; margin-top: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <h1>🎬 潛意識電影院</h1>
    <p style="color: #a4b0be;">錄下你昨晚的夢境，讓 AI 幫你把夢境沖洗成電影短片</p>

    <button id="recordBtn" class="btn">🎤 開始記錄夢境</button>
    <button id="developBtn" class="btn" style="background:#2ed573; display:none;">🎞️ 開始沖洗夢境電影</button>

    <div id="statusText" style="margin-top:15px; color:#ced6e0;"></div>

    <div id="result">
        <h3 style="margin-top:0; border-bottom: 2px solid #ff4757; padding-bottom: 10px;">🔮 夢境分析報告</h3>
        
        <div class="seed-row">
            <div class="seed-label">情緒標籤</div>
            <div id="tagsContainer"></div>
        </div>

        <div class="seed-row" style="flex-direction: column; align-items: flex-start;">
            <div class="seed-label">AI 導演提示詞</div>
            <div id="promptBox" class="prompt-box"></div>
        </div>

        <div id="videoDisplaySection" style="margin-top: 20px; display: none;">
            <div class="seed-label" style="width:100%; margin-bottom:10px;">🎬 夢境電影放映中</div>
            <video id="dreamVideoPlayer" controls autoplay loop playsinline></video>
        </div>

        <div id="movieLoadingStatus" style="display:none;">⏳ 正在連線到 Kling AI 影像生成器...</div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let currentTaskId = null;

        const recordBtn = document.getElementById('recordBtn');
        const developBtn = document.getElementById('developBtn');
        const statusText = document.getElementById('statusText');
        const resultDiv = document.getElementById('result');

        // 1. 處理錄音功能
        recordBtn.addEventListener('click', async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                recordBtn.innerText = "🎤 開始記錄夢境";
                statusText.innerText = "錄音完成！點擊下方綠色按鈕開始沖洗影片。";
                developBtn.style.display = "inline-block";
            } else {
                audioChunks = [];
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                };
                mediaRecorder.start();
                recordBtn.innerText = "🛑 停止錄音";
                statusText.innerText = "正在聆聽你的夢境中...";
            }
        });

        // 2. 點擊「開始沖洗夢境電影」
        developBtn.addEventListener('click', async () => {
            developBtn.disabled = true;
            developBtn.style.opacity = "0.5";
            document.getElementById('movieLoadingStatus').style.display = 'block';
            document.getElementById('movieLoadingStatus').innerText = "⚡ 正在將語音轉成劇本提示詞並提交給 Kling AI...";
            resultDiv.style.display = 'block';

            const formData = new FormData();
            if (audioBlob) {
                formData.append('audio', audioBlob, 'dream.webm');
            }
            formData.append('mode', 'full_process');

            try {
                // 發送給後端 API
                const res = await fetch('/api/dream-process', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success && data.taskId) {
                    currentTaskId = data.taskId;
                    
                    // 顯示 GPT 生成的提示詞與標籤
                    document.getElementById('promptBox').innerText = data.videoPrompt;
                    const tagsContainer = document.getElementById('tagsContainer');
                    tagsContainer.innerHTML = '';
                    data.tags.forEach(t => {
                        const span = document.createElement('span');
                        span.className = 'tag';
                        span.innerText = `# ${t}`;
                        tagsContainer.appendChild(span);
                    });

                    // 開始輪詢檢查 Kling 的影片好了沒
                    checkVideoStatus();
                } else {
                    alert("建立任務失敗：" + (data.error || "未知錯誤"));
                    developBtn.disabled = false;
                    developBtn.style.opacity = "1";
                }
            } catch (err) {
                alert("網路連線失敗：" + err.message);
                developBtn.disabled = false;
                developBtn.style.opacity = "1";
            }
        });

        // 3. 檢查 Kling 影片進度
        function checkVideoStatus() {
            const statusDiv = document.getElementById('movieLoadingStatus');
            
            const interval = setInterval(async () => {
                try {
                    const checkForm = new FormData();
                    checkForm.append('mode', 'check_status');
                    checkForm.append('taskId', currentTaskId);

                    const res = await fetch('/api/dream-process', { method: 'POST', body: checkForm });
                    const statusResult = await res.json();

                    if (statusResult.success) {
                        const currentStatus = statusResult.status; // SUCCEED, PROCESSING, QUEUED, FAILED
                        
                        // 影片做好了！
                        if (currentStatus === 'SUCCEED' && statusResult.videoUrl) {
                            clearInterval(interval);
                            statusDiv.style.display = 'none';
                            
                            // 這裡直接塞入影片網址並播放
                            const player = document.getElementById('dreamVideoPlayer');
                            player.src = statusResult.videoUrl;
                            document.getElementById('videoDisplaySection').style.display = 'block';
                            
                            developBtn.disabled = false;
                            developBtn.style.opacity = "1";
                        } 
                        // 失敗了
                        else if (currentStatus === 'FAILED') {
                            clearInterval(interval);
                            statusDiv.innerText = "❌ Kling 影像生成失敗，請再試一次";
                            developBtn.disabled = false;
                            developBtn.style.opacity = "1";
                        } 
                        // 還在排隊或做圖中
                        else {
                            statusDiv.innerText = "⏳ 影片製作中... 目前狀態：" + (currentStatus === 'PROCESSING' ? "正在渲染影片" : "排隊中");
                        }
                    }
                } catch (e) {
                    console.log("檢查進度中發生微小異常，繼續嘗試...", e);
                }
            }, 5000); // 每 5 秒自動幫你問一次 Kling 好了沒
        }
    </script>
</body>
</html>
